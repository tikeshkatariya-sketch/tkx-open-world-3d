
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TKX OPEN WORLD 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#loading{
 position:fixed;inset:0;background:#101b2b;color:white;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;z-index:20;text-align:center
}
#loading h1{font-size:27px;color:#55e6ff;margin-bottom:12px}
#loading p{font-size:14px;color:#ddd}
#hud{
 position:fixed;top:12px;left:12px;color:white;z-index:5;
 background:#0008;padding:12px 16px;border-radius:12px;
 border:1px solid #ffffff44
}
#hud strong{font-size:17px;color:#5deaff}
#hud small{display:block;margin-top:5px;color:#eee}
#controls{position:fixed;inset:0;z-index:6;pointer-events:none}
#joystick{
 position:absolute;left:25px;bottom:30px;width:130px;height:130px;
 border-radius:50%;background:#ffffff35;border:2px solid #ffffff80;
 pointer-events:auto;touch-action:none
}
#stick{
 position:absolute;left:39px;top:39px;width:48px;height:48px;
 border-radius:50%;background:#fff9;border:2px solid white
}
#jump{
 position:absolute;right:25px;bottom:35px;width:75px;height:75px;
 border-radius:50%;border:2px solid white;background:#13a9dfcc;
 color:white;font-size:15px;font-weight:bold;pointer-events:auto
}
#sprint{
 position:absolute;right:30px;bottom:125px;width:65px;height:45px;
 border-radius:14px;border:1px solid white;background:#16a06dcc;
 color:white;font-weight:bold;pointer-events:auto
}
#hint{
 position:fixed;bottom:8px;left:50%;transform:translateX(-50%);
 color:white;background:#0008;padding:7px 12px;border-radius:10px;
 font-size:11px;white-space:nowrap;z-index:5
}
#message{
 position:fixed;top:90px;left:50%;transform:translateX(-50%);
 color:white;background:#0009;padding:9px 15px;border-radius:10px;
 font-size:13px;z-index:5;white-space:nowrap
}
</style>
</head>
<body>

<div id="loading">
<h1>TKX OPEN WORLD 3D</h1>
<p>आपका शहर तैयार हो रहा है...</p>
</div>

<div id="hud">
<strong>TKX OPEN WORLD</strong>
<small>शहर में आपका स्वागत है</small>
<small id="position">स्थान: 0, 0</small>
</div>

<div id="message">शहर में घूमना शुरू करें!</div>

<div id="controls">
<div id="joystick"><div id="stick"></div></div>
<button id="sprint">दौड़ें</button>
<button id="jump">कूदें</button>
</div>

<div id="hint">बाईं तरफ चलाएँ • दाईं तरफ स्क्रीन खींचकर कैमरा घुमाएँ</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const loading = document.getElementById('loading');
const positionText = document.getElementById('position');
const message = document.getElementById('message');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 75, 260);

const camera = new THREE.PerspectiveCamera(
 65, window.innerWidth/window.innerHeight, 0.1, 500
);

const renderer = new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:"high-performance"
});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.shadowMap.enabled = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// रोशनी
scene.add(new THREE.HemisphereLight(0xffffff,0x52734c,2));

const sunlight = new THREE.DirectionalLight(0xffffff,2.2);
sunlight.position.set(-60,100,50);
scene.add(sunlight);

// जमीन
const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 new THREE.MeshLambertMaterial({color:0x64a65b})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.08;
scene.add(ground);

// सड़क बनाने का तरीका
function box(w,h,d,color,x,y,z){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshLambertMaterial({color})
 );
 mesh.position.set(x,y,z);
 scene.add(mesh);
 return mesh;
}

// शहर की सड़कें
for(let i=-2;i<=2;i++){
 let roadPos=i*55;

 box(14,0.08,300,0x30343a,roadPos,0,0);
 box(300,0.08,14,0x30343a,0,0,roadPos);

 // सड़क के बीच की सफेद लाइनें
 for(let k=-130;k<=130;k+=15){
  box(0.25,0.1,5,0xffffff,roadPos,0.07,k);
  box(5,0.1,0.25,0xffffff,k,0.07,roadPos);
 }
}

// इमारतें
const buildingColors=[
 0xd8dce2,0xe7c9a5,0xb6c8d8,
 0xc4d2c6,0xd8b5a7,0xb8b9d1,
 0xe4dfd0
];

function makeBuilding(x,z){
 const w=12+Math.random()*10;
 const d=12+Math.random()*10;
 const h=12+Math.random()*38;
 const color=buildingColors[
  Math.floor(Math.random()*buildingColors.length)
 ];

 box(w,h,d,color,x,h/2,z);

 // छत
 box(w+0.5,0.6,d+0.5,0x555d68,x,h+0.2,z);

 // खिड़कियाँ
 for(let y=3;y<h-2;y+=4){
  for(let side=-1;side<=1;side+=2){
   for(let a=-w/2+2;a<w/2-1;a+=4){
    box(1.7,2,0.12,0x72bce0,x+a,y,z+side*(d/2+0.07));
    box(0.12,2,1.7,x+a,y,z+side*(d/2+0.07));
   }
  }
 }
}

// इमारतों के लिए जगह
for(let x=-135;x<=135;x+=27){
 for(let z=-135;z<=135;z+=27){
  const nearRoadX=Math.abs((x+27.5)%55-27.5)<12;
  const nearRoadZ=Math.abs((z+27.5)%55-27.5)<12;
  if(!nearRoadX && !nearRoadZ){
   makeBuilding(x+(Math.random()-0.5)*5,
                z+(Math.random()-0.5)*5);
  }
 }
}

// पेड़
function makeTree(x,z){
 const trunk= new THREE.Mesh(
  new THREE.CylinderGeometry(0.35,0.5,3,7),
  new THREE.MeshLambertMaterial({color:0x79502c})
 );
 trunk.position.set(x,1.5,z);
 scene.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(2.2,8,7),
  new THREE.MeshLambertMaterial({color:0x218b42})
 );
 leaves.position.set(x,4,z);
 scene.add(leaves);
}

for(let i=0;i<100;i++){
 let x=(Math.random()-0.5)*280;
 let z=(Math.random()-0.5)*280;

 if(Math.abs(x%55)>10 && Math.abs(z%55)>10){
  makeTree(x,z);
 }
}

// पार्क
box(35,0.12,35,0x4eaa55,65,0.02,65);
for(let i=0;i<12;i++){
 makeTree(50+Math.random()*25,50+Math.random()*25);
}

// खिलाड़ी
const player=new THREE.Group();

const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(0.65,1.1,4,8),
 new THREE.MeshLambertMaterial({color:0x1766d1})
);
body.position.y=1.2;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(0.42,12,10),
 new THREE.MeshLambertMaterial({color:0xdca77d})
);
head.position.y=2.25;
player.add(head);

const hair=new THREE.Mesh(
 new THREE.SphereGeometry(0.43,12,8,0,Math.PI*2,0,Math.PI/2),
 new THREE.MeshLambertMaterial({color:0x171717})
);
hair.position.y=2.48;
player.add(hair);

player.position.set(0,0,0);
scene.add(player);

// कैमरा
let cameraYaw=0;
let cameraPitch=0.25;
const cameraDistance=8;

function updateCamera(){
 const target=new THREE.Vector3(
  player.position.x,
  player.position.y+2,
  player.position.z
 );

 camera.position.set(
  target.x+Math.sin(cameraYaw)*cameraDistance,
  target.y+3+cameraPitch*5,
  target.z+Math.cos(cameraYaw)*cameraDistance
 );
 camera.lookAt(target);
}
updateCamera();

// मोबाइल जॉयस्टिक
const joystick=document.getElementById('joystick');
const stick=document.getElementById('stick');

let joyX=0,joyY=0;
let joyPointer=null;

function moveStick(e){
 const r=joystick.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 const max=42;
 const len=Math.sqrt(x*x+y*y);
 if(len>max){x=x/len*max;y=y/len*max;}
 joyX=x/max;
 joyY=y/max;
 stick.style.left=(39+x)+"px";
 stick.style.top=(39+y)+"px";
}

joystick.addEventListener('pointerdown',e=>{
 joyPointer=e.pointerId;
 joystick.setPointerCapture(e.pointerId);
 moveStick(e);
});
joystick.addEventListener('pointermove',e=>{
 if(e.pointerId===joyPointer)moveStick(e);
});
function resetStick(){
 joyPointer=null;
 joyX=0;joyY=0;
 stick.style.left="39px";
 stick.style.top="39px";
}
joystick.addEventListener('pointerup',resetStick);
joystick.addEventListener('pointercancel',resetStick);

// कैमरा घुमाना
let lookPointer=null;
let lastX=0,lastY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.clientX<window.innerWidth*0.35)return;
 lookPointer=e.pointerId;
 lastX=e.clientX;
 lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(e.pointerId!==lookPointer)return;
 let dx=e.clientX-lastX;
 let dy=e.clientY-lastY;
 cameraYaw-=dx*0.006;
 cameraPitch=Math.max(-0.5,Math.min(0.8,cameraPitch+dy*0.003));
 lastX=e.clientX;
 lastY=e.clientY;
});
renderer.domElement.addEventListener('pointerup',()=>{
 lookPointer=null;
});

// दौड़ना और कूदना
let sprint=false;
let jumping=false;
let velocityY=0;

const sprintButton=document.getElementById('sprint');
sprintButton.addEventListener('pointerdown',()=>sprint=true);
sprintButton.addEventListener('pointerup',()=>sprint=false);
sprintButton.addEventListener('pointercancel',()=>sprint=false);
sprintButton.addEventListener('pointerleave',()=>sprint=false);

document.getElementById('jump').addEventListener('pointerdown',()=>{
 if(player.position.y<=0.01 && !jumping){
  velocityY=8;
  jumping=true;
 }
});

// कीबोर्ड नियंत्रण
const keys={};
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// गेम चलाना
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),0.04);

 let forward=-joyY;
 let sideways=joyX;

 if(keys['w']||keys['arrowup'])forward=1;
 if(keys['s']||keys['arrowdown'])forward=-1;
 if(keys['a']||keys['arrowleft'])sideways=-1;
 if(keys['d']||keys['arrowright'])sideways=1;

 const moving=Math.abs(forward)+Math.abs(sideways)>0.08;
 const speed=sprint?12:6;

 const direction=new THREE.Vector3(
  -Math.sin(cameraYaw),
  0,
  -Math.cos(cameraYaw)
 );
 const right=new THREE.Vector3(
  Math.cos(cameraYaw),
  0,
  -Math.sin(cameraYaw)
 );

 const movement=new THREE.Vector3();
 movement.addScaledVector(direction,forward);
 movement.addScaledVector(right,sideways);

 if(movement.length()>1)movement.normalize();

 player.position.addScaledVector(movement,speed*dt);

 if(moving){
  player.rotation.y=Math.atan2(movement.x,movement.z);
 }

 // कूदना
 if(jumping || player.position.y>0){
  velocityY-=20*dt;
  player.position.y+=velocityY*dt;
  if(player.position.y<=0){
   player.position.y=0;
   velocityY=0;
   jumping=false;
  }
 }

 // दुनिया की सीमा
 player.position.x=THREE.MathUtils.clamp(player.position.x,-180,180);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-180,180);

 updateCamera();

 positionText.textContent=
  "स्थान: "+Math.round(player.position.x)+", "+
  Math.round(player.position.z);

 renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});

loading.style.display="none";
animate();
</script>
</body>
  </html>
